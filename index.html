<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Browser</title>
<style>
:root{color-scheme:light dark;--bg:#dee1e6;--bar:#fff;--field:#f1f3f4;--text:#202124;--sub:#5f6368;--line:#dadce0;--accent:#1a73e8;--hover:#e8eaed}
@media(prefers-color-scheme:dark){:root{--bg:#202124;--bar:#35363a;--field:#202124;--text:#e8eaed;--sub:#9aa0a6;--line:#5f6368;--accent:#8ab4f8;--hover:#45464a}}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{display:flex;flex-direction:column;background:var(--bg);color:var(--text);font:13px/1.4 system-ui,Segoe UI,sans-serif;overflow:hidden}
#strip{display:flex;align-items:flex-end;padding:7px 8px 0;min-height:42px;gap:4px}#tabs{display:flex;min-width:0;overflow:auto;align-items:flex-end;flex:1}.tab{display:flex;align-items:center;gap:8px;height:34px;flex:0 1 210px;min-width:55px;padding:0 6px 0 12px;border-radius:8px 8px 0 0;color:var(--sub);cursor:pointer;user-select:none}.tab.on{background:var(--bar);color:var(--text)}.tab .t{flex:1;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.x,.tool{border:0;background:none;color:var(--sub);cursor:pointer;border-radius:50%;padding:7px}.x:hover,.tool:hover{background:var(--hover)}#bar{display:flex;align-items:center;gap:4px;padding:6px 8px;background:var(--bar)}#addrwrap{flex:1;min-width:0}#addr{width:100%;height:36px;border:2px solid transparent;border-radius:20px;background:var(--field);color:var(--text);padding:0 16px;font:14px system-ui;outline:0}#addr:focus{border-color:var(--accent);background:var(--bar)}#view{position:relative;flex:1;min-height:0;background:var(--bar)}.pane{position:absolute;inset:0;display:none}.pane.on{display:block}.page{width:100%;height:100%;border:0;background:white}.start{height:100%;overflow:auto;text-align:center;padding:10vh 16px}.start h1{font-size:52px;font-weight:500;margin:0 0 26px}.search{width:min(580px,95%);height:46px;border:1px solid var(--line);border-radius:24px;padding:0 20px;font:16px system-ui;background:var(--bar);color:var(--text)}.tiles{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin:28px auto;max-width:700px}.tile{width:110px;padding:15px 8px;border-radius:9px;cursor:pointer;overflow:hidden;text-overflow:ellipsis}.tile:hover{background:var(--hover)}.tile b{display:block;font-size:24px;margin-bottom:8px}.notice{padding:10px 14px;background:var(--field);border-bottom:1px solid var(--line);color:var(--sub);text-align:left}.notice a{color:var(--accent)}#msg{font-size:12px;color:var(--sub);padding:4px 12px;background:var(--bar)}@media(max-width:600px){.tab{flex-basis:130px}#strip{padding-left:4px;padding-right:4px}.tool{padding:5px}}
</style></head><body>
<div id="strip"><div id="tabs"></div><button class="tool" id="add" title="New tab (Ctrl+T)">＋</button></div>
<div id="bar"><button class="tool" id="back" title="Back">←</button><button class="tool" id="forward" title="Forward">→</button><button class="tool" id="reload" title="Reload">↻</button><button class="tool" id="home" title="Home">⌂</button><div id="addrwrap"><input id="addr" placeholder="Search or type a URL" autocomplete="off" spellcheck="false"></div><button class="tool" id="bookmark" title="Bookmark page">☆</button><button class="tool" id="menu" title="Browser options">⋮</button></div>
<div id="view"></div><div id="msg">Standalone HTML browser shell · Some websites block being displayed inside another page.</div>
<script>
(()=>{'use strict';
const $=s=>document.querySelector(s), engines={Google:'https://www.google.com/search?q=',DuckDuckGo:'https://duckduckgo.com/?q=',Bing:'https://www.bing.com/search?q=',Wikipedia:'https://en.wikipedia.org/w/index.php?search='};
let engine='Google',tabs=[],active=null,nextId=1,bookmarks=JSON.parse(localStorage.getItem('onebrowser-bookmarks')||'[]'),historyList=JSON.parse(localStorage.getItem('onebrowser-history')||'[]');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function normalize(q){q=q.trim();if(!q)return 'browser://home';if(q==='browser://bookmarks'||q==='browser://history')return q;if(/^https?:\/\//i.test(q))return q;if(!/\s/.test(q)&&/^(localhost|[\w-]+(\.[\w-]+)+)(:\d+)?([\/?#].*)?$/i.test(q))return 'https://'+q;return engines[engine]+encodeURIComponent(q)}
function host(u){try{return new URL(u).hostname.replace(/^www\./,'')}catch{return u}}
function persist(){localStorage.setItem('onebrowser-bookmarks',JSON.stringify(bookmarks));localStorage.setItem('onebrowser-history',JSON.stringify(historyList))}
function createTab(url='browser://home'){const t={id:nextId++,title:'New tab',url,stack:[],pos:-1,pane:document.createElement('div')};t.pane.className='pane';$('#view').append(t.pane);tabs.push(t);activate(t);navigate(url);return t}
function activate(t){active=t;tabs.forEach(x=>x.pane.classList.toggle('on',x===t));renderTabs();syncBar()}
function renderTabs(){$('#tabs').innerHTML=tabs.map(t=>`<div class="tab ${t===active?'on':''}" data-tab="${t.id}" title="${esc(t.title)}"><span>🌐</span><span class="t">${esc(t.title)}</span><button class="x" data-close="${t.id}" aria-label="Close tab">×</button></div>`).join('')}
function syncBar(){$('#addr').value=active&&active.url.startsWith('browser://')?'':active?.url||'';$('#back').disabled=!active||active.pos<=0;$('#forward').disabled=!active||active.pos>=active.stack.length-1;$('#bookmark').textContent=active&&bookmarks.some(b=>b.url===active.url)?'★':'☆'}
function navigate(raw,replace=false){if(!active)return;const url=normalize(raw);if(!replace){active.stack=active.stack.slice(0,active.pos+1);active.stack.push(url);active.pos++}active.url=url;renderPage(active);if(!url.startsWith('browser://')){historyList.unshift({url,time:Date.now()});historyList=historyList.slice(0,250);persist()}syncBar();renderTabs()}
function renderPage(t){const u=t.url;t.pane.innerHTML='';if(u==='browser://home'){t.title='New tab';t.pane.innerHTML=`<div class="start"><h1><span style="color:#4285f4">B</span><span style="color:#ea4335">r</span><span style="color:#fbbc05">o</span><span style="color:#34a853">w</span><span style="color:#4285f4">s</span><span style="color:#ea4335">e</span><span style="color:#fbbc05">r</span></h1><form id="searchform"><input class="search" id="startsearch" placeholder="Search the web or enter a URL" autofocus></form><div class="tiles">${(bookmarks.length?bookmarks:[{url:'https://www.wikipedia.org',title:'Wikipedia'},{url:'https://www.youtube.com',title:'YouTube'},{url:'https://www.google.com',title:'Google'},{url:'https://github.com',title:'GitHub'}]).slice(0,12).map(b=>`<div class="tile" data-go="${esc(b.url)}"><b>🌐</b>${esc(b.title||host(b.url))}</div>`).join('')}</div><p style="color:var(--sub)">One HTML file with tabs, navigation, bookmarks and search.</p></div>`;$('#startsearch',t.pane).focus();$('#searchform',t.pane).addEventListener('submit',e=>{e.preventDefault();navigate($('#startsearch',t.pane).value)});return}
if(u==='browser://bookmarks'){t.title='Bookmarks';t.pane.innerHTML=`<div class="start"><h2>Bookmarks</h2>${bookmarks.map(b=>`<p><a href="#" data-go="${esc(b.url)}">${esc(b.title||b.url)}</a> — <button data-remove="${esc(b.url)}">Remove</button></p>`).join('')||'<p>No bookmarks yet. Click ☆ while viewing a page.</p>'}</div>`;return}
if(u==='browser://history'){t.title='History';t.pane.innerHTML=`<div class="start"><h2>History</h2><button id="clearhistory">Clear history</button>${historyList.map(h=>`<p><a href="#" data-go="${esc(h.url)}">${esc(h.url)}</a> <small>${new Date(h.time).toLocaleString()}</small></p>`).join('')}</div>`;$('#clearhistory',t.pane).onclick=()=>{historyList=[];persist();renderPage(t)};return}
t.title=host(u);const notice=document.createElement('div');notice.className='notice';notice.innerHTML='If this website stays blank or shows an error, it may block embedding. <a href="'+esc(u)+'" target="_blank" rel="noopener">Open this site in a new browser tab/window</a>.';const frame=document.createElement('iframe');frame.className='page';frame.referrerPolicy='no-referrer';frame.setAttribute('sandbox','allow-forms allow-scripts allow-same-origin allow-popups allow-popups-to-escape-sandbox allow-downloads');frame.src=u;t.pane.append(notice,frame)}
function close(id){const i=tabs.findIndex(t=>t.id===id);if(i<0)return;const was=tabs[i]===active;tabs[i].pane.remove();tabs.splice(i,1);if(!tabs.length)createTab();else if(was)activate(tabs[Math.min(i,tabs.length-1)])}
$('#add').onclick=()=>createTab();$('#home').onclick=()=>navigate('browser://home');$('#reload').onclick=()=>renderPage(active);$('#back').onclick=()=>{if(active.pos>0){active.pos--;active.url=active.stack[active.pos];renderPage(active);syncBar();renderTabs()}};$('#forward').onclick=()=>{if(active.pos<active.stack.length-1){active.pos++;active.url=active.stack[active.pos];renderPage(active);syncBar();renderTabs()}};
$('#addr').addEventListener('keydown',e=>{if(e.key==='Enter')navigate($('#addr').value);if(e.key==='Escape')syncBar()});
$('#bookmark').onclick=()=>{if(!active||active.url.startsWith('browser://'))return;const i=bookmarks.findIndex(b=>b.url===active.url);if(i>=0)bookmarks.splice(i,1);else bookmarks.push({url:active.url,title:active.title});persist();syncBar()};
$('#menu').onclick=()=>{const choice=prompt('Type: new, bookmarks, history, search engine (Google, DuckDuckGo, Bing, Wikipedia)');if(!choice)return;const c=choice.toLowerCase();if(c==='new')createTab();else if(c==='bookmarks')navigate('browser://bookmarks');else if(c==='history')navigate('browser://history');else if(engines[choice]){engine=choice;alert('Search engine set to '+engine)}};
document.addEventListener('click',e=>{const c=e.target.closest('[data-close]');if(c){e.stopPropagation();close(+c.dataset.close);return}const tab=e.target.closest('[data-tab]');if(tab){activate(tabs.find(t=>t.id===+tab.dataset.tab));return}const go=e.target.closest('[data-go]');if(go){e.preventDefault();navigate(go.dataset.go);return}const rm=e.target.closest('[data-remove]');if(rm){bookmarks=bookmarks.filter(b=>b.url!==rm.dataset.remove);persist();renderPage(active)}});
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='t'){e.preventDefault();createTab()}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='w'){e.preventDefault();if(active)close(active.id)}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='l'){e.preventDefault();$('#addr').focus();$('#addr').select()}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='r'){e.preventDefault();renderPage(active)}if(e.altKey&&e.key==='ArrowLeft')$('#back').click();if(e.altKey&&e.key==='ArrowRight')$('#forward').click()});
createTab();
})();
</script></body></html>
